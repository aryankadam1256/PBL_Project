<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Scheduler Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body.dark-mode {
      background-color: #121212;
      color: #ffffff;
    }
    .dark-mode .fc {
      background-color: #1e1e1e;
      color: #fff;
    }
    #calendar {
      flex: 2;
    }
    .middle-sidebar, .right-sidebar {
      width: 280px;
    }
    .middle-sidebar {
      margin-left: 15px;
    }
    canvas {
      max-width: 100%;
    }
  </style>
</head>
<body class="p-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>📊 Smart Scheduler Dashboard</h2>
    <div>
      <button id="darkModeToggle" class="btn btn-secondary me-2">🌓 Toggle Dark Mode</button>
      <button id="todayButton" class="btn btn-primary me-2">📅 Go to Today</button>
      <button id="voiceButton" class="btn btn-info">🎙️ Click & Speak</button>
    </div>
  </div>

  <div class="d-flex">
    <!-- Calendar Section -->
    <div id="calendar"></div>

    <!-- Event Controls Sidebar -->
    <div class="middle-sidebar">
      <h5>➕ Add / ✏️ Modify / ❌ Delete</h5>
      <div class="mb-2">
        <input type="date" id="eventDate" class="form-control form-control-sm">
      </div>
      <div class="mb-2">
        <input type="text" id="eventName" placeholder="Event Name" class="form-control form-control-sm">
      </div>
      <div class="mb-2">
        <select id="eventType" class="form-select form-select-sm">
          <option value="event">Event</option>
          <option value="exam">Exam</option>
          <option value="holiday">Holiday</option>
        </select>
      </div>
      <div class="d-grid gap-2 mb-4">
        <button class="btn btn-success btn-sm" onclick="addEvent()">Add</button>
        <button class="btn btn-warning btn-sm" onclick="modifyEvent()">Modify</button>
        <button class="btn btn-danger btn-sm" onclick="deleteEvent()">Delete</button>
      </div>

      <h5>📌 Today's Items</h5>
      <div id="todaySidebar" class="border p-2 rounded small mb-3"></div>

      <a href="timetable.html" class="btn btn-outline-primary btn-sm w-100">🎨 Customize Theme</a>
    </div>

    <!-- Pie Chart Sidebar -->
    <div class="right-sidebar ms-3">
      <h5>✅ Completion Chart</h5>
      <canvas id="taskChart" height="250"></canvas>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <script>
    let calendar;
    let eventStorage = JSON.parse(localStorage.getItem("events")) || {};

    document.addEventListener("DOMContentLoaded", function () {
      calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {
        initialView: "dayGridMonth",
        selectable: true,
        height: 'auto',
        headerToolbar: {
          left: "prev,next today",
          center: "title",
          right: "dayGridMonth,timeGridWeek,timeGridDay"
        },
        dateClick: function(info) {
          document.getElementById("eventDate").value = info.dateStr;
        }
      });
      calendar.render();
      refreshCalendar();
    });

    function getEventColor(type) {
      return type === "holiday" ? "#ff4d4d" :
             type === "event" ? "#3498db" :
             type === "exam" ? "#f39c12" : "#2ecc71";
    }

    function refreshCalendar() {
      calendar.removeAllEvents();
      const today = new Date().toISOString().split("T")[0];
      const todaySidebar = document.getElementById("todaySidebar");
      todaySidebar.innerHTML = "";

      Object.keys(eventStorage).forEach(date => {
        eventStorage[date].forEach(event => {
          calendar.addEvent({
            title: event.name,
            start: date,
            color: getEventColor(event.type)
          });

          if (date === today) {
            const div = document.createElement("div");
            div.className = "form-check";
            const id = event.name + date;
            div.innerHTML = `
              <input class="form-check-input task-check" type="checkbox" id="${id}">
              <label class="form-check-label" for="${id}">${event.name} (${event.type})</label>
            `;
            todaySidebar.appendChild(div);
          }
        });
      });

      document.querySelectorAll(".task-check").forEach(checkbox => {
        checkbox.addEventListener("change", updateChart);
      });

      updateChart();
    }

    function addEvent() {
      const date = document.getElementById("eventDate").value;
      const name = document.getElementById("eventName").value;
      const type = document.getElementById("eventType").value;
      if (!date || !name) return alert("Please enter both date and name!");
      if (!eventStorage[date]) eventStorage[date] = [];
      eventStorage[date].push({ name, type });
      saveAndRefresh();
    }

    function modifyEvent() {
      const date = document.getElementById("eventDate").value;
      const name = document.getElementById("eventName").value;
      const type = document.getElementById("eventType").value;
      if (!date || !name) return alert("Please enter both date and name!");
      if (eventStorage[date]) {
        let found = eventStorage[date].find(e => e.name === name);
        if (found) {
          found.type = type;
          saveAndRefresh();
        } else {
          alert("Event not found to modify.");
        }
      }
    }

    function deleteEvent() {
      const date = document.getElementById("eventDate").value;
      const name = document.getElementById("eventName").value;
      if (eventStorage[date]) {
        eventStorage[date] = eventStorage[date].filter(e => e.name !== name);
        if (eventStorage[date].length === 0) delete eventStorage[date];
        saveAndRefresh();
      }
    }

    function saveAndRefresh() {
      localStorage.setItem("events", JSON.stringify(eventStorage));
      refreshCalendar();
    }

    // Dark Mode Toggle
    document.getElementById('darkModeToggle').addEventListener('click', function() {
      document.body.classList.toggle('dark-mode');
      localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
    });
    if (localStorage.getItem('darkMode') === 'true') {
      document.body.classList.add('dark-mode');
    }

    // Today Button
    document.getElementById('todayButton').addEventListener('click', function () {
      const today = new Date().toISOString().split('T')[0];
      window.location.href = `timetable.html?date=${today}`;
    });

    // Voice Control
    const voiceButton = document.getElementById("voiceButton");
    let recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = "en-US";
    voiceButton.addEventListener("click", function() {
      voiceButton.textContent = "🎤 Listening...";
      recognition.start();
    });
    recognition.onresult = function(event) {
      let command = event.results[0][0].transcript.toLowerCase();
      let match = command.match(/(january|february|march|april|may|june|july|august|september|october|november|december) (\d+)/);
      if (match) {
        let month = match[1];
        let day = match[2];
        let year = new Date().getFullYear();
        let monthNum = new Date(`${month} 1, ${year}`).getMonth() + 1;
        let dateStr = `${year}-${monthNum.toString().padStart(2, '0')}-${day.padStart(2, '0')}`;
        window.location.href = `timetable.html?date=${dateStr}`;
      } else {
        alert("❌ Couldn't recognize the date. Try saying: 'Show timetable for February 5'");
      }
      voiceButton.textContent = "🎙️ Click & Speak";
    };

    // Chart Setup
    const ctx = document.getElementById('taskChart').getContext('2d');
    let taskChart = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['Completed', 'Pending'],
        datasets: [{
          label: 'Today\'s Progress',
          data: [0, 1],
          backgroundColor: ['#28a745', '#dc3545'],
          borderWidth: 1
        }]
      },
      options: {
        plugins: {
          legend: { position: 'bottom' }
        },
        cutout: '70%'
      }
    });

    function updateChart() {
      const all = document.querySelectorAll('.task-check');
      const completed = Array.from(all).filter(c => c.checked).length;
      const total = all.length || 1;
      taskChart.data.datasets[0].data = [completed, total - completed];
      taskChart.update();
    }
  </script>
</body>
</html>
