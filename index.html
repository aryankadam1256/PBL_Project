<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Scheduler Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <style>
        body.dark-mode {
            background-color: #121212;
            color: #ffffff;
        }
        .dark-mode .fc {
            background-color: #1e1e1e;
            color: #fff;
        }
        .event-box {
            padding: 6px;
            border-radius: 5px;
            margin-bottom: 5px;
            color: white;
        }
        .fc-event-title {
            color: white;
        }
    </style>
</head>
<body class="p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>📊 Smart Scheduler Dashboard</h2>
        <div>
            <button id="darkModeToggle" class="btn btn-secondary me-2">🌓 Toggle Dark Mode</button>
            <button id="todayButton" class="btn btn-primary me-2">📅 Go to Today</button>
            <button id="voiceButton" class="btn btn-info">🎙️ Click & Speak</button>
        </div>
    </div>

    <div class="mb-3">
        <input type="text" id="searchInput" class="form-control" placeholder="🔍 Search Events...">
    </div>

    <div id="calendar"></div>

    <!-- Add/Modify/Delete Section -->
    <div class="mt-5">
        <h4>➕ Add / ✏️ Modify / ❌ Delete Event</h4>
        <div class="row g-2">
            <div class="col-md-3">
                <input type="date" id="eventDate" class="form-control">
            </div>
            <div class="col-md-3">
                <input type="text" id="eventName" placeholder="Event Name" class="form-control">
            </div>
            <div class="col-md-2">
                <select id="eventType" class="form-select">
                    <option value="event">Event</option>
                    <option value="exam">Exam</option>
                    <option value="holiday">Holiday</option>
                </select>
            </div>
            <div class="col-md-4 d-flex gap-2">
                <button class="btn btn-success" onclick="addEvent()">Add</button>
                <button class="btn btn-warning" onclick="modifyEvent()">Modify</button>
                <button class="btn btn-danger" onclick="deleteEvent()">Delete</button>
            </div>
        </div>
    </div>

    <!-- Today's Summary -->
    <div class="mt-5">
        <h4>📅 Today's Schedule</h4>
        <div id="todaySummary" class="p-3 border rounded">
            <p>No events for today.</p>
        </div>
    </div>

    <div class="mt-4">
        <a href="timetable.html" class="btn btn-outline-primary">🎨 Customize Theme (Timetable)</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script>
        let calendar;
        let eventStorage = JSON.parse(localStorage.getItem("events")) || {};

        document.addEventListener("DOMContentLoaded", function () {
            const calendarEl = document.getElementById("calendar");
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: "dayGridMonth",
                selectable: true,
                headerToolbar: {
                    left: "prev,next today",
                    center: "title",
                    right: "dayGridMonth,timeGridWeek,timeGridDay"
                },
                dateClick: function(info) {
                    document.getElementById("eventDate").value = info.dateStr;
                }
            });
            calendar.render();
            refreshCalendar();
            updateTodaySummary();
        });

        function getEventColor(type) {
            return type === "holiday" ? "#ff4d4d" :
                   type === "event" ? "#3498db" :
                   type === "exam" ? "#f39c12" : "#2ecc71";
        }

        function refreshCalendar() {
            calendar.removeAllEvents();
            Object.keys(eventStorage).forEach(date => {
                eventStorage[date].forEach(event => {
                    calendar.addEvent({
                        title: event.name,
                        start: date,
                        color: getEventColor(event.type)
                    });
                });
            });
            updateTodaySummary();
        }

        function updateTodaySummary() {
            const today = new Date().toISOString().split("T")[0];
            const container = document.getElementById("todaySummary");
            container.innerHTML = "";

            if (eventStorage[today] && eventStorage[today].length > 0) {
                eventStorage[today].forEach(ev => {
                    const div = document.createElement("div");
                    div.className = "event-box";
                    div.style.backgroundColor = getEventColor(ev.type);
                    div.textContent = `${ev.name} (${ev.type})`;
                    container.appendChild(div);
                });
            } else {
                container.innerHTML = "<p>No events for today.</p>";
            }
        }

        function addEvent() {
            const date = document.getElementById("eventDate").value;
            const name = document.getElementById("eventName").value;
            const type = document.getElementById("eventType").value;

            if (!date || !name) return alert("Please enter both date and name!");

            if (!eventStorage[date]) eventStorage[date] = [];
            eventStorage[date].push({ name, type });
            saveAndRefresh();
        }

        function modifyEvent() {
            const date = document.getElementById("eventDate").value;
            const name = document.getElementById("eventName").value;
            const type = document.getElementById("eventType").value;

            if (!date || !name) return alert("Please enter both date and name!");

            if (eventStorage[date]) {
                let found = eventStorage[date].find(e => e.name === name);
                if (found) {
                    found.type = type;
                    saveAndRefresh();
                } else {
                    alert("Event not found to modify.");
                }
            }
        }

        function deleteEvent() {
            const date = document.getElementById("eventDate").value;
            const name = document.getElementById("eventName").value;

            if (eventStorage[date]) {
                eventStorage[date] = eventStorage[date].filter(e => e.name !== name);
                if (eventStorage[date].length === 0) delete eventStorage[date];
                saveAndRefresh();
            }
        }

        function saveAndRefresh() {
            localStorage.setItem("events", JSON.stringify(eventStorage));
            refreshCalendar();
        }

        // Dark Mode Toggle
        const darkModeToggle = document.getElementById('darkModeToggle');
        darkModeToggle.addEventListener('click', function() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
        });
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
        }

        // Go to Today
        const todayButton = document.getElementById('todayButton');
        todayButton.addEventListener('click', function () {
            const today = new Date().toISOString().split('T')[0];
            window.location.href = `timetable.html?date=${today}`;
        });

        // Voice Control
        const voiceButton = document.getElementById("voiceButton");
        let recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = "en-US";
        voiceButton.addEventListener("click", function() {
            voiceButton.textContent = "🎤 Listening...";
            recognition.start();
        });
        recognition.onresult = function(event) {
            let command = event.results[0][0].transcript.toLowerCase();
            let match = command.match(/(january|february|march|april|may|june|july|august|september|october|november|december) (\d+)/);
            if (match) {
                let month = match[1];
                let day = match[2];
                let year = new Date().getFullYear();
                let monthNum = new Date(`${month} 1, ${year}`).getMonth() + 1;
                let dateStr = `${year}-${monthNum.toString().padStart(2, '0')}-${day.padStart(2, '0')}`;
                window.location.href = `timetable.html?date=${dateStr}`;
            } else {
                alert("❌ Couldn't recognize the date. Try saying: 'Show timetable for February 5'");
            }
            voiceButton.textContent = "🎙️ Click & Speak";
        };

        // Search Filter
        document.getElementById("searchInput").addEventListener("input", function () {
            const query = this.value.toLowerCase();
            calendar.removeAllEvents();
            Object.keys(eventStorage).forEach(date => {
                eventStorage[date].forEach(event => {
                    if (event.name.toLowerCase().includes(query)) {
                        calendar.addEvent({
                            title: event.name,
                            start: date,
                            color: getEventColor(event.type)
                        });
                    }
                });
            });
        });
    </script>
</body>
</html>
